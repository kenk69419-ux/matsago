name: Build Android APK (Amalin Ortu)

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get Dependencies
        run: flutter pub get

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build APK Release (Split Per ABI)
        run: flutter build apk --release --split-per-abi --android-skip-build-dependency-validation

      - name: Build Universal APK Slim (Khusus HP Android, Buang Kode PC x86)
        run: flutter build apk --release --target-platform android-arm,android-arm64 --android-skip-build-dependency-validation

      - name: Upload APK Universal (Semua HP Android)
        uses: actions/upload-artifact@v4
        with:
          name: amalin-ortu-UNIVERSAL-SEMUA-HP
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK Khusus Redmi 9C & HP 32-bit (armeabi-v7a)
        uses: actions/upload-artifact@v4
        with:
          name: amalin-ortu-Redmi9C-HP32bit-11MB
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk

      - name: Upload APK Khusus Redmi Note 10S & HP 64-bit (arm64-v8a)
        uses: actions/upload-artifact@v4
        with:
          name: amalin-ortu-RedmiNote10S-HP64bit-12MB
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
