name: Build Android APK (Amalin Ortu)

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get Dependencies
        run: flutter pub get

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build APK Release (Split Per ABI)
        run: flutter build apk --release --split-per-abi --android-skip-build-dependency-validation

      - name: Upload APK Arm64 Saja (Hanya ~12MB)
        uses: actions/upload-artifact@v4
        with:
          name: amalin-ortu-release-apk-12MB
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
